name: Dewpoint
description: 'Dewpoint Therapeutics is a Boston-based biotechnology company, founded in 2018, that
  pioneers drug discovery based on biomolecular condensates — the membraneless compartments inside
  cells whose formation and dysregulation underlie many diseases. Its condensate platform combines
  cell biology, high-throughput screening, and machine learning to identify condensate-modulating
  drugs (c-mods) against previously undruggable targets across oncology, neurodegeneration, and
  virology. Dewpoint is backed by SoftBank Vision Fund 2 and completed a $150M Series C in 2022. The
  company operates as a therapeutics developer and, as of this profile, exposes no public developer
  API, documentation, or developer portal; this entry captures its identity within the API Evangelist
  network.'
